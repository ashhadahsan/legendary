<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="legendary">
  <title>legendary</title>
  <defs>
    <linearGradient id="lg-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="lg-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <g transform="translate(4 4)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#lg-badge)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="15.5" r="5.2"/>
      <path d="M32 20.7V49"/>
      <path d="M21 27h22"/>
      <path d="M17.6 23.6 21 27l-3.4 3.4"/>
      <path d="M46.4 23.6 43 27l3.4 3.4"/>
      <path d="M16.5 37.5c0 8.9 7 13.5 15.5 13.5s15.5-4.6 15.5-13.5"/>
    </g>
    <circle cx="49.5" cy="15" r="5.6" fill="#FBBF24" stroke="url(#lg-badge)" stroke-width="2.4"/>
  </g>

  <!-- wordmark: gradient fill reads on both light and dark backgrounds -->
  <text x="84" y="47"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="34" font-weight="600" letter-spacing="-0.5"
        fill="url(#lg-word)">legendary</text>
</svg>
